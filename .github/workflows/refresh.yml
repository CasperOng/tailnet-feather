name: Refresh Feed

# The app repository publishes every build of main to a rolling release, so a few
# polls a day are enough. Add a FEED_DISPATCH_TOKEN to the app repository to refresh
# immediately instead.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      source_tag:
        description: Release tag in CasperOng/tailnet to publish
        required: false
        default: latest
  repository_dispatch:
    types: [tailnet-build]

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    name: Publish the newest unsigned build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the newest build
        id: fetch
        env:
          # Both repositories are private, so the app's rolling release needs a
          # token to read. A fine-grained PAT with contents:read on CasperOng/tailnet.
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SOURCE_TAG: ${{ github.event.client_payload.source_tag || inputs.source_tag || 'latest' }}
        run: python3 scripts/update_feed.py

      - name: Commit the feed
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "tailnet-feed-bot"
          git config user.email "tailnet-feed-bot@users.noreply.github.com"
          git add ipas apps.json LATEST-BUILD.md
          git commit -m "chore(feed): publish the newest build"
          git push

      - name: Summarise
        run: |
          {
            echo "## tailnet feed"
            echo
            echo "Feed updated: ${{ steps.fetch.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
